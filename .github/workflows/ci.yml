# BespokeSynth CI
#
# Plain build check: verify that BespokeSynth compiles on Linux, macOS, and
# Windows, with both Faust backends (the default interpreter and the
# llvm_download LLVM backend), plus a clang-format check on the Source tree.
# Runs on every push to any branch and on every pull request.
#
# This is intentionally minimal and uses standard GitHub Actions practices:
# configure with CMake and build the BespokeSynth target. No packaging,
# code signing, or artifact publishing.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14
          - windows-latest
        backend:
          - interpreter
          - llvm_download

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            devscripts \
            libxcb-cursor-dev \
            libxcb-keysyms1-dev \
            libxcb-util-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            ninja-build \
            xcb \
            libgtk-3-dev \
            libwebkit2gtk-4.0 \
            libwebkit2gtk-4.0-dev \
            libcurl4-openssl-dev \
            alsa \
            alsa-tools \
            libasound2-dev \
            libjack-dev \
            libfreetype6-dev \
            libxinerama-dev \
            libxcb-xinerama0 \
            libxinerama1 \
            x11proto-xinerama-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxcursor1 \
            libxcb-cursor-dev \
            libxcb-cursor0 \
            libusb-1.0.0-dev \
            patchelf

      - name: Configure CMake
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-*)   CMAKE_ARGS="-GNinja" ;;
            macos-*)    CMAKE_ARGS="" ;;
            windows-*)  CMAKE_ARGS="-A x64" ;;
          esac
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBESPOKE_FAUST_BACKEND=${{ matrix.backend }} $CMAKE_ARGS

      - name: Build BespokeSynth
        run: |
          cmake --build build --config Release --target BespokeSynth --parallel 4

  format:
    name: Code formatting
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.key] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22
          sudo mv /usr/bin/clang-format-22 /usr/bin/clang-format

      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -- ':(glob)Source/**/*.cpp' ':(glob)Source/**/*.h' \
            | xargs clang-format --dry-run --Werror
