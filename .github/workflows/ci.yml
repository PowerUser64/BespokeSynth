# BespokeSynth GitHub Actions CI
#
# Port of the Azure Pipelines "Build" job (azure-pipelines.yml) to GitHub
# Actions, reduced to build on commits only. It runs the nightly-style build on
# every push to any branch (Release config, `nightly-package` target). The Azure
# PR-specific branch (Debug + BESPOKE_WERROR) and the Release/nightly
# publishing pipeline are intentionally not included.
#
# The Azure variable groups `mac-signing` and `libraries` are mapped to GitHub
# Actions repository secrets. Configure them in
# Settings -> Secrets and variables -> Actions:
#
#   - MAC_SIGNING_CERT        (Developer ID signing identity, eg "Developer ID Application: ...")
#   - MAC_EXPORTED_CERT_PW    (password for the .p12 certificates)
#   - MAC_CERT_APP_B64        (base64 of bespoke_dev_id_app.p12)
#   - MAC_CERT_INST_B64       (base64 of bespoke_dev_id_inst.p12)
#   - MAC_INSTALLING_CERT     (used by the mac codesign/notarize scripts)
#   - MAC_SIGNING_1UPW        (Apple notarytool app-specific password)
#   - MAC_SIGNING_ID          (Apple ID used for notarization)
#   - MAC_SIGNING_TEAM        (Apple team ID used for notarization)
#   - EXTRA_APIS_ZIP          (base64 of extra_apis.zip, only used for nightly builds)
#   - LIBRARY_PATHS           (extra cmake -D arguments for nightly builds)
#
# Azure secure files (extra_apis.zip, the two .p12 certs) have no GitHub
# equivalent, so they are stored as base64-encoded secrets and decoded here.

name: CI

on:
  push:

jobs:
  Build:
    timeout-minutes: 120
    runs-on: ${{ matrix.imageName }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-x64
            imageName: macos-14
            isMac: true
            isWindows: false
            isLinux: false
            # NOTE: -DBESPOKE_SIGN_AS is added in the configure step because
            # secrets cannot be referenced inside the matrix.
            cmakeArguments: '-GXcode -D"CMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DBESPOKE_PYTHON_ROOT=/Library/Frameworks/Python.framework/Versions/3.10'
            cmakeTarget: "BespokeSynth"
          - name: windows-x64
            imageName: windows-latest
            isMac: false
            isWindows: true
            isLinux: false
            cmakeArguments: "-A x64"
            cmakeTarget: "BespokeSynth"
          - name: code-formatting
            imageName: ubuntu-22.04
            isMac: false
            isWindows: false
            isLinux: true
            cmakeArguments: ""
            cmakeTarget: "code-quality-pipeline-checks"
          - name: linux-x64
            imageName: ubuntu-22.04
            isMac: false
            isWindows: false
            isLinux: true
            cmakeArguments: "-GNinja"
            cmakeTarget: "BespokeSynth"

    env:
      # On every commit push to main we build a Release config and the
      # nightly-package target. The clang-format matrix entry instead builds the
      # code-quality-pipeline-checks target (Debug). This mirrors the Azure
      # "details on build" logic with the PR-specific branch removed.
      CMAKE_CONFIG: ${{ matrix.cmakeTarget == 'code-quality-pipeline-checks' && 'Debug' || 'Release' }}
      CMAKE_TARGET: ${{ matrix.cmakeTarget == 'code-quality-pipeline-checks' && matrix.cmakeTarget || 'nightly-package' }}

    steps:
      - name: all - checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
          # submodules are fetched separately below (depth=1 fails here)

      - name: all - details on build
        run: |
          echo "BUILD REASON   = " "${{ github.event_name }}"
          echo "cmakeArguments = " "${{ matrix.cmakeArguments }}"
          echo "cmakeConfig    = " "$CMAKE_CONFIG"
          echo "cmakeTarget    = " "$CMAKE_TARGET"

      - name: all - submodule init
        run: |
          git submodule update --init --recursive --depth 1

      - name: linux - run apt-get
        if: matrix.isLinux
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
              devscripts \
              libxcb-cursor-dev \
              libxcb-keysyms1-dev \
              libxcb-util-dev \
              libxkbcommon-dev \
              libxkbcommon-x11-dev \
              ninja-build \
              xcb \
              libgtk-3-dev \
              libwebkit2gtk-4.0 \
              libwebkit2gtk-4.0-dev \
              libcurl4-openssl-dev \
              alsa \
              alsa-tools \
              libasound2-dev \
              libjack-dev \
              libfreetype6-dev \
              libxinerama-dev \
              libxcb-xinerama0 \
              libxinerama1 \
              x11proto-xinerama-dev \
              libxrandr-dev \
              libgl1-mesa-dev \
              libxcursor-dev \
              libxcursor1 \
              libxcb-cursor-dev \
              libxcb-cursor0 \
              libusb-1.0.0-dev \
              patchelf

      - name: mac - install dependencies needed for distribution build
        if: matrix.isMac
        run: |
          npm install -g appdmg
          wget https://www.python.org/ftp/python/3.10.0/python-3.10.0post2-macos11.pkg
          sudo installer -pkg python-3.10.0post2-macos11.pkg -target /

      - name: mac - install signing certificates
        if: matrix.isMac
        env:
          MAC_CERT_APP_B64: ${{ secrets.MAC_CERT_APP_B64 }}
          MAC_CERT_INST_B64: ${{ secrets.MAC_CERT_INST_B64 }}
          MAC_EXPORTED_CERT_PW: ${{ secrets.MAC_EXPORTED_CERT_PW }}
        run: |
          set -e

          # Decode base64-encoded certificates
          echo "$MAC_CERT_APP_B64" | base64 --decode > bespoke_dev_id_app.p12
          echo "$MAC_CERT_INST_B64" | base64 --decode > bespoke_dev_id_inst.p12

          # Create and unlock a temporary keychain (equivalent of Azure's
          # InstallAppleCertificate@2 tasks)
          KEYCHAIN="bespoke.keychain-db"
          KEYCHAIN_PW="bespoke"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          # Import the certificates so codesign/notarytool can find them
          security import bespoke_dev_id_app.p12 -k "$KEYCHAIN" -P "$MAC_EXPORTED_CERT_PW" -T /usr/bin/codesign -T /usr/bin/security
          security import bespoke_dev_id_inst.p12 -k "$KEYCHAIN" -P "$MAC_EXPORTED_CERT_PW" -T /usr/bin/codesign -T /usr/bin/security

          # Disable keychain timeouts so the certs stay available during the build
          security set-keychain-settings -t 3600 "$KEYCHAIN" || true

      - name: move extra_apis
        env:
          EXTRA_APIS_ZIP: ${{ secrets.EXTRA_APIS_ZIP }}
        run: |
          set -e
          echo "$EXTRA_APIS_ZIP" | base64 --decode > extra_apis.zip
          unzip -q extra_apis.zip -d extra_apis

      - name: all - configure with cmake for nightly
        if: matrix.cmakeTarget != 'code-quality-pipeline-checks'
        env:
          MAC_SIGNING_CERT: ${{ secrets.MAC_SIGNING_CERT }}
          LIBRARY_PATHS: ${{ secrets.LIBRARY_PATHS }}
        run: |
          set -e
          echo Building with BUILD_TYPE = $CMAKE_CONFIG and arguments = ${{ matrix.cmakeArguments }}
          EXTRA_ARGS=()
          if [ "${{ matrix.isMac }}" == "true" ] && [ -n "$MAC_SIGNING_CERT" ]; then
            EXTRA_ARGS+=("-DBESPOKE_SIGN_AS=$MAC_SIGNING_CERT")
          fi
          cmake -Bbuild ${{ matrix.cmakeArguments }} "${EXTRA_ARGS[@]}" $LIBRARY_PATHS -DCMAKE_BUILD_TYPE=$CMAKE_CONFIG -DBESPOKE_PORTABLE=True -DBESPOKE_NIGHTLY=True

      - name: mac - build with cmake
        if: matrix.isMac
        shell: bash
        env:
          MAC_INSTALLING_CERT: ${{ secrets.MAC_INSTALLING_CERT }}
          MAC_SIGNING_1UPW: ${{ secrets.MAC_SIGNING_1UPW }}
          MAC_SIGNING_CERT: ${{ secrets.MAC_SIGNING_CERT }}
          MAC_SIGNING_ID: ${{ secrets.MAC_SIGNING_ID }}
          MAC_SIGNING_TEAM: ${{ secrets.MAC_SIGNING_TEAM }}
        run: |
          set -e
          echo Building with TARGET = $CMAKE_TARGET
          cmake --build build --config $CMAKE_CONFIG --target $CMAKE_TARGET

      - name: win - build with cmake
        if: matrix.isWindows
        shell: bash
        run: |
          set -e
          echo Building with TARGET = $CMAKE_TARGET
          cmake --build build --config $CMAKE_CONFIG --target $CMAKE_TARGET

      - name: lin - build with cmake
        if: matrix.isLinux
        run: |
          set -e
          echo Building with TARGET = $CMAKE_TARGET
          cmake --build build --config $CMAKE_CONFIG --target $CMAKE_TARGET

      - name: win - copy win artifact
        if: matrix.isWindows && matrix.cmakeTarget != 'code-quality-pipeline-checks'
        shell: bash
        run: |
          set -e
          echo Copying build output from build/Source/BespokeSynth_artefacts/Release to windows_nightly_artefact
          cp -R build/Source/BespokeSynth_artefacts/Release windows_nightly_artefact

      - name: win - compress win artifact
        if: matrix.isWindows && matrix.cmakeTarget != 'code-quality-pipeline-checks'
        shell: pwsh
        run: |
          echo Compressing build output from windows_nightly_artefact to build/nightly
          mkdir build/nightly
          Compress-Archive -Path windows_nightly_artefact/* -DestinationPath build/nightly/BespokeSynth-Windows.zip

      - name: lin - compress lin artifact
        if: matrix.isLinux && matrix.cmakeTarget != 'code-quality-pipeline-checks'
        run: |
          set -e
          echo Compressing build output from build/Source/BespokeSynth_artefacts/Release to build/nightly
          mkdir build/nightly
          tar -cvzf build/nightly/BespokeSynth-Linux.tar.gz build/Source/BespokeSynth_artefacts/Release

      - name: lin - make git log info
        if: matrix.isLinux
        run: |
          mkdir -p stage_git/git_info
          git log -1 --pretty=format:'%h : %s - %an' > stage_git/git_info/git_nightly_log_display
          git log -1 --pretty=format:'%h : %s%n%aD%n%an%n%n%B' > stage_git/git_info/git_nightly_log_long_display
          git log -5 --pretty=format:'%h : %s - %an' > stage_git/git_info/git_nightly_recent_five
          git log -1 --pretty=format:'%h' > stage_git/git_info/git_nightly_log_hash
          cat stage_git/git_info/*

      - name: lin - publish the git info
        if: matrix.isLinux
        uses: actions/upload-artifact@v4
        with:
          name: GIT_INFO
          path: stage_git/

      - name: mac - publish mac artifact
        if: matrix.isMac && matrix.cmakeTarget != 'code-quality-pipeline-checks'
        uses: actions/upload-artifact@v4
        with:
          name: INSTALLER_MAC_NIGHTLY
          path: build/nightly

      - name: win - publish win artifact
        if: matrix.isWindows && matrix.cmakeTarget != 'code-quality-pipeline-checks'
        uses: actions/upload-artifact@v4
        with:
          name: INSTALLER_WIN_NIGHTLY
          path: build/nightly

      - name: lin - publish lin artifact
        if: matrix.isLinux && matrix.cmakeTarget != 'code-quality-pipeline-checks'
        uses: actions/upload-artifact@v4
        with:
          name: INSTALLER_LIN_NIGHTLY
          path: build/nightly
